<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: abstract geometric mark - overlapping rounded shapes suggesting connectivity/data -->
  <g>
    <rect x="15" y="15" width="150" height="150" rx="40" fill="url(#grad1)"/>
    <!-- Abstract signal/pulse mark -->
    <path d="M 45 105 L 65 105 L 78 70 L 95 130 L 110 90 L 122 105 L 135 105"
          stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="135" cy="105" r="6" fill="white"/>
  </g>

  <!-- Wordmark - lowercase, tighter, modern sans-serif -->
  <text x="188" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#0F0A2E">tech<tspan fill="url(#textGrad)">blog</tspan></text>
</svg>
